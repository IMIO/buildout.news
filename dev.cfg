[buildout]
extends =
    base.cfg
    sources.cfg

extensions =
    mr.developer

auto-checkout +=
    imio.news.core
    imio.news.policy
    imio.smartweb.common
    imio.smartweb.locales
    collective.upgrade
    imio.pyutils
    imio.helpers
    collective.autopublishing
    collective.behavior.talcondition
    collective.fingerpointing
    collective.privacy
    collective.timedevents

[instance]
debug-mode = on
verbose-security = on
event-log-level = DEBUG
user = admin:admin
eggs +=
    ${debug-products:eggs}
zcml-additional =
 <configure xmlns:solr="http://namespaces.plone.org/solr">
   <solr:connection host="localhost" port="8983" base="/solr/news"/>
 </configure>
